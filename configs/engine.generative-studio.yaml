# CPU/RAM masterpiece tier. The OpenVINO model proposes color and lighting;
# MangaHue preserves source luminance, panel geometry, ink, and dialogue.
engine:
  mode: quality
  parallel_jobs: 1
  pyramid_enabled: false
  hint_propagation_enabled: true
inference:
  model_path: models/studio-lcm-int8
  model_metadata_path: models/model.mangahue.json
  device: cpu
  batch_size: 1
  input_size: 512
  fp16_enabled: false
  resize_policy: fit
pyramid:
  enabled: false
  levels: [2048]
  blend_weights: [1.0]
layout:
  tile_size: 2048
  tile_overlap: 128
hints:
  hint_blur_radius: 5.0
  propagation_radius: 24
  propagation_similarity_threshold: 0.32
  adaptive_placement_enabled: true
  region_style_hints_enabled: true
  region_style_hint_budget: 24
ensemble:
  enabled: false
  strategy: confidence_weighted
  primary_weight: 1.0
  parallel_variants: false
  divergence_reject_threshold: 0.5
  cielab_distance: true
postprocess:
  final_sharpening: 0.18
  palette_correction: true
  reference_finishing: true
  semantic_relighting: true
  relighting_strength: 0.24
  midtone_depth: 0.18
  local_contrast: 0.13
  target_colorfulness: 1.28
  natural_grading: true
  reference_transfer: false
  muted_target_grade: true
  muted_strength: 0.58
  muted_hue_shift_deg: 3
  muted_dark_pull: 0.34
  soft_strength: 0.88
  soft_confidence: 0.86
  muted_dark_sat: 0.19
  muted_mid_sat: 0.30
  muted_bright_sat: 0.24
  muted_paper_sat: 0.02
