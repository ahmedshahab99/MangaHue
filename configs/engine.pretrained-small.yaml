engine:
  mode: balanced
  parallel_jobs: 1
  pyramid_enabled: false

preprocess:
  denoise_enabled: true
  denoise_strength: 1
  max_input_dimension: 2400

layout:
  tiling_enabled: true
  tile_size: 512
  tile_overlap: 96

inference:
  model_path: models/pretrained/manga-colorization-v2
  device: cpu
  batch_size: 1
  input_size: 384
  fp16_enabled: false
  resize_policy: fit

postprocess:
  restore_lines: true
  line_strength: 1.0
  bubble_cleanup: true
  bleeding_correction: true
  palette_correction: true
  final_sharpening: 0.12

output:
  format: png
  quality: 95
  write_report: true
  write_intermediates: false
