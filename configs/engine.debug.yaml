engine:
  mode: debug
  save_debug_outputs: true
  parallel_jobs: 1
  pyramid_enabled: false
  hint_propagation_enabled: false
output:
  write_intermediates: true
  write_report: true
eval:
  line_preservation_threshold: 0.85
  protected_region_violation_threshold: 0.90
  hint_adherence_threshold: 0.55
  screen_tone_warning_threshold: 0.30
