engine:
  parallel_jobs: 1
  pyramid_enabled: false
  hint_propagation_enabled: false

preprocess:
  denoise_enabled: false
  denoise_strength: 0
  max_input_dimension: 1024
  line_sharpening: 0.35

layout:
  tiling_enabled: false
  tile_size: 1024
  tile_overlap: 0

inference:
  model_path: models/ddcolor-full-fp16.onnx
  model_metadata_path: configs/model-contracts/manga-colorization-v2-onnx.json
  device: cpu
  batch_size: 1
  input_size: 1024
  fp16_enabled: false
  resize_policy: fit

hints:
  user_hints_enabled: false
  character_memory_enabled: false
  style_hints_enabled: true
  hint_blur_radius: 4.0
  hint_strength: 1.0
  region_style_hints_enabled: true
  region_style_hint_budget: 18

postprocess:
  restore_lines: true
  line_strength: 1.0
  bubble_cleanup: false
  bleeding_correction: false
  palette_correction: true
  region_chroma_separation: 34.0
  final_sharpening: 0.03
  reference_finishing: true
  # Finishing stays luma-focused (gloss/shadow): the chroma expansion
  # amplified the model's golden warmth, so it is cut to a whisper here —
  # the smart governor owns the page's color intensity now.
  target_colorfulness: 0.2
  midtone_depth: 0.05
  local_contrast: 0.07
  semantic_relighting: false
  relighting_strength: 0.0
  natural_grading: false
  muted_target_grade: true
  muted_strength: 0.4
  # Golden-cast fix: shift the 20-75 deg band toward red-orange (the
  # reference's hue mass sits at 0-45 deg) with an extra push on the
  # yellow core — skin (0-20) stays untouched.
  muted_hue_shift_deg: 16.0
  muted_yellow_shift_deg: 16.0
  muted_dark_pull: 0.5
  muted_dark_sat: 0.26
  muted_mid_sat: 0.38
  muted_bright_sat: 0.36
  muted_paper_sat: 0.02
  muted_vivid_preserve: 1.0
  soft_coverage: true
  soft_strength: 0.85
  soft_confidence: 0.8
  model_first: true
  seed_chroma_bar_bright: 22.0
  seed_chroma_bar_mid: 12.0
  model_chroma_bar_bright: 18.0
  model_chroma_bar_mid: 10.0
  model_chroma_gain: 1.0
  palette_harmony_strength: 0.1
  face_paint_strength: 0.45
  # Soft cel depth: ink-cast directional shadows (AO) at their own strength,
  # with the page's own estimated light direction. No photoreal relighting
  # (relighting_strength stays 0) — just readable cel shading.
  ambient_occlusion_strength: 0.7
  # Smart color governor: measures each page's saturation + colorfulness and
  # applies a bounded chroma gain toward these targets, scaled by the
  # model's own chroma signal. Muted pages stay muted; colorful pages keep
  # their life — the color budget follows the model's judgment.
  smart_governor: true
  governor_target_saturation: 0.24
  governor_target_colorfulness: 48.0
  governor_min_gain: 0.8
  governor_max_gain: 1.35
  # Warmth governor: the model's palette leans golden; compress warm pixels
  # toward neutral until the page's midtone R-B matches this target.
  governor_target_warmth: 45.0

output:
  format: png
  quality: 95
  write_report: true
  write_intermediates: false

eval:
  line_preservation_threshold: 0.88
  protected_region_violation_threshold: 0.92
  hint_adherence_threshold: 0.62
  screen_tone_warning_threshold: 0.18
