name: mangahue

services:
  api:
    build:
      context: .
      target: runtime-small
    image: mangahue:${MANGAHUE_TAG:-local}
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    ports:
      - "${MANGAHUE_BIND:-127.0.0.1}:${API_PORT:-7878}:7878"
    environment:
      RUST_LOG: ${RUST_LOG:-mangahue=info,tower_http=info}
      MANGAHUE_MAX_CONCURRENT_JOBS: ${MANGAHUE_MAX_CONCURRENT_JOBS:-1}
      MANGAHUE_JOB_RETENTION_HOURS: ${MANGAHUE_JOB_RETENTION_HOURS:-24}
      MANGAHUE_DEFAULT_MODEL: /app/models/ddcolor-full-fp32.onnx
      MANGAHUE_DEFAULT_CONFIG: /app/configs/engine.default.yaml
      MANGAHUE_DEFAULT_STYLE: /app/configs/styles/soft_cel_anime_v2.yaml
      MANGAHUE_MODEL_THREADS: ${MANGAHUE_MODEL_THREADS:-2}
      MANGAHUE_MODEL_TIMEOUT_SECONDS: ${MANGAHUE_MODEL_TIMEOUT_SECONDS:-900}
      OMP_NUM_THREADS: ${MANGAHUE_MODEL_THREADS:-2}
      OPENBLAS_NUM_THREADS: ${MANGAHUE_MODEL_THREADS:-2}
      XDG_CACHE_HOME: /tmp/cache
    volumes:
      - mangahue-data:/data
      - ./models:/app/models:ro
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: ${MANGAHUE_API_MEMORY:-4608m}
    cpus: ${MANGAHUE_API_CPUS:-2.0}
    logging:
      driver: json-file
      options:
        max-size: 25m
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7878/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  worker:
    profiles: ["durable"]
    image: mangahue:${MANGAHUE_TAG:-local}
    restart: unless-stopped
    init: true
    entrypoint: ["mangahue-worker"]
    command:
      - "--database"
      - "/data/production.db"
      - "--object-store"
      - "/data/objects"
      - "--worker-id"
      - "${WORKER_ID:-cpu-worker-1}"
    environment:
      RUST_LOG: ${RUST_LOG:-mangahue=info}
      MANGAHUE_MODEL_THREADS: ${MANGAHUE_MODEL_THREADS:-2}
      MANGAHUE_MODEL_TIMEOUT_SECONDS: ${MANGAHUE_MODEL_TIMEOUT_SECONDS:-900}
      OMP_NUM_THREADS: ${MANGAHUE_MODEL_THREADS:-2}
      XDG_CACHE_HOME: /tmp/cache
    volumes:
      - mangahue-data:/data
      - ./models:/app/models:ro
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 192
    mem_limit: ${MANGAHUE_WORKER_MEMORY:-4096m}
    cpus: ${MANGAHUE_WORKER_CPUS:-1.0}
    depends_on:
      api:
        condition: service_healthy

volumes:
  mangahue-data:
