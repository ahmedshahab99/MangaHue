services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "7878:7878"
    volumes:
      - mangahue-data:/data
      - ./models:/app/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7878/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build: .
    restart: unless-stopped
    entrypoint: ["mangahue-worker"]
    command: ["--database", "/data/production.db", "--object-store", "/data/objects", "--worker-id", "gpu-worker-1"]
    volumes:
      - mangahue-data:/data
      - ./models:/app/models:ro
    depends_on:
      api:
        condition: service_healthy

  telegram:
    build: .
    restart: unless-stopped
    profiles: ["telegram"]
    entrypoint: ["mangahue-telegram"]
    command: ["--work-dir", "/data/telegram", "--max-pages", "32", "--pyramid", "--hint-propagate"]
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    volumes:
      - mangahue-data:/data
      - ./models:/app/models:ro

  telegram-small:
    build: .
    restart: unless-stopped
    profiles: ["telegram-small"]
    entrypoint: ["mangahue-telegram"]
    command:
      - "--work-dir"
      - "/data/telegram"
      - "--max-pages"
      - "32"
      - "--max-concurrent-jobs"
      - "1"
      - "--model"
      - "/app/models/pretrained/manga-colorization-v2"
      - "--preset"
      - "/app/configs/engine.pretrained-small.yaml"
      - "--hint-propagate"
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      MANGAHUE_MODEL_THREADS: ${MANGAHUE_MODEL_THREADS:-2}
    volumes:
      - mangahue-data:/data
      - ${MANGAHUE_PRETRAINED_MODEL_DIR:-./models/pretrained/manga-colorization-v2}:/app/models/pretrained/manga-colorization-v2:ro

volumes:
  mangahue-data:
