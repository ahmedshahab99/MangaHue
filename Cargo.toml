[workspace]
resolver = "2"
members = [
  "crates/mangahue-core",
  "crates/mangahue-config",
  "crates/mangahue-image",
  "crates/mangahue-preprocess",
  "crates/mangahue-layout",
  "crates/mangahue-hints",
  "crates/mangahue-memory",
  "crates/mangahue-inference",
  "crates/mangahue-postprocess",
  "crates/mangahue-eval",
  "crates/mangahue-cache",
  "crates/mangahue-brain",
  "crates/mangahue-chapter",
  "crates/mangahue-ingest",
  "crates/mangahue-telegram",
  "crates/mangahue-ensemble",
  "crates/mangahue-pyramid",
  "crates/mangahue-orchestrator",
  "crates/mangahue-cli",
  "crates/mangahue-api",
  "crates/mangahue-platform",
  "crates/mangahue-production",
  "crates/mangahue-worker",
  "crates/mangahue-intelligence",
  "crates/mangahue-export",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["MangaHue AI"]
repository = "https://example.com/mangahue-engine"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "tiff", "bmp"] }
imageproc = "0.25"
rayon = "1.10"
walkdir = "2.5"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
tempfile = "3.10"
sysinfo = { version = "0.31", default-features = false, features = ["system"] }
sha2 = "0.10"
base64 = "0.22"
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1.40", features = ["fs", "io-util", "macros", "rt-multi-thread", "signal", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tower = { version = "0.5", features = ["util"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
scraper = "0.23"
url = "2.5"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
ort = { version = "2.0.0-rc.12", default-features = false, features = ["ndarray", "std", "load-dynamic", "api-24"] }
ndarray = { version = "0.17", features = ["std"] }
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
