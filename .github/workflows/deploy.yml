name: Immutable production release

on:
  workflow_run:
    workflows: ["MangaHue CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Exact commit SHA to promote"
        required: true

permissions:
  contents: read

concurrency:
  group: mangahue-production
  cancel-in-progress: false

env:
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha || inputs.commit_sha }}

jobs:
  release-gates:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      deploy_enabled: ${{ steps.config.outputs.enabled }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Build immutable binary release
        run: |
          cargo build --locked --release -p mangahue-telegram
          install -d release/bin
          install -m 0755 target/release/mangahue-telegram release/bin/mangahue-telegram
          cp -a configs release/configs
          printf '%s\n' "$RELEASE_SHA" > release/REVISION
          tar -C release -czf "mangahue-${RELEASE_SHA}.tar.gz" .
          sha256sum "mangahue-${RELEASE_SHA}.tar.gz" > "mangahue-${RELEASE_SHA}.sha256"
      - uses: actions/upload-artifact@v6
        with:
          name: mangahue-${{ env.RELEASE_SHA }}
          path: |
            mangahue-${{ env.RELEASE_SHA }}.tar.gz
            mangahue-${{ env.RELEASE_SHA }}.sha256
          if-no-files-found: error
          retention-days: 30
      - id: config
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [[ -n "$VPS_HOST" && -n "$VPS_USER" && -n "$VPS_SSH_KEY" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Release built but production secrets are not configured; deployment skipped."
          fi

  deploy:
    needs: release-gates
    if: needs.release-gates.outputs.deploy_enabled == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: mangahue-${{ env.RELEASE_SHA }}
      - name: Upload exact release archive
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "mangahue-${{ env.RELEASE_SHA }}.tar.gz,mangahue-${{ env.RELEASE_SHA }}.sha256"
          target: /home/mangahue-deploy/upload
      - name: Atomically promote and verify
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -Eeuo pipefail
            sudo /usr/local/sbin/mangahue-promote '${{ env.RELEASE_SHA }}'
