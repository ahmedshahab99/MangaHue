name: MangaHue CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: mangahue-ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  python-training:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install numpy pillow onnxruntime opencv-python-headless pytest pytest-asyncio
      - run: python -m compileall python/mangahue_train
      - run: PYTHONPATH=python python -m pytest -q python/tests
      - run: bash -n scripts/setup-vps.sh scripts/healthcheck.sh scripts/cleanup-old-vps-bot.sh scripts/download_ddcolor_tiny.sh

  container:
    runs-on: ubuntu-latest
    needs: [rust, python-training]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime-small
          load: true
          tags: mangahue:${{ github.sha }}
          cache-from: type=gha,scope=mangahue-runtime-small
          cache-to: type=gha,mode=max,scope=mangahue-runtime-small
      - run: >-
          docker run --rm --entrypoint python mangahue:${{ github.sha }}
          -c "import numpy, onnxruntime, PIL, mangahue_train.ddcolor_onnx_worker; print('compact runtime OK')"
      - run: docker run --rm --entrypoint mangahue-api mangahue:${{ github.sha }} --help
