name: MangaHue CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: mangahue-ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  python-and-studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r python_bot/requirements.txt pytest pytest-asyncio
      - run: python -m compileall python/mangahue_train python_bot
      - run: python -m pytest -q python_bot/tests python/tests
      - run: node --check web/studio/studio.js
      - run: npm ci
        working-directory: web/app
      - run: npm run lint
        working-directory: web/app
      - run: npm run typecheck
        working-directory: web/app
      - run: npm run build
        working-directory: web/app
      - run: bash -n scripts/setup-vps.sh scripts/healthcheck.sh scripts/cleanup-old-vps-bot.sh

  container:
    runs-on: ubuntu-latest
    needs: [rust, python-and-studio]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime-small
          load: true
          tags: mangahue:${{ github.sha }}
          cache-from: type=gha,scope=mangahue-runtime-small
          cache-to: type=gha,mode=max,scope=mangahue-runtime-small
      - run: >-
          docker run --rm --entrypoint python mangahue:${{ github.sha }}
          -c "import numpy, onnxruntime, PIL, mangahue_train.onnx_worker; print('compact runtime OK')"
      - run: docker run --rm --entrypoint mangahue-telegram mangahue:${{ github.sha }} --help
