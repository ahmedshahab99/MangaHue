[project]
name = "mangahue-train"
version = "0.1.0"
description = "PyTorch training and ONNX export tools for MangaHue Engine"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pillow>=10.0",
  "torch>=2.2",
  "onnx>=1.16",
  "onnxruntime>=1.17",
  "tqdm>=4.66",
]

[project.scripts]
mangahue-export-onnx = "mangahue_train.export_onnx:main"
mangahue-validate-onnx = "mangahue_train.validate_onnx:main"
mangahue-prepare-dataset = "mangahue_train.prepare_dataset:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

