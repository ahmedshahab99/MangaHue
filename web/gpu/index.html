<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MangaHue GPU Studio — colorize with YOUR GPU</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, sans-serif; background: #14161a; color: #e8e6e3; margin: 0; }
  header { padding: 18px 24px; border-bottom: 1px solid #2a2d33; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; }
  .badge { font-size: 12px; padding: 3px 10px; border-radius: 999px; }
  .ok { background: #1f5d38; color: #a7f3c0; }
  .no { background: #5d2f1f; color: #f3b7a7; }
  main { max-width: 1200px; margin: 0 auto; padding: 24px; }
  #drop { border: 2px dashed #3a3f47; border-radius: 12px; padding: 40px; text-align: center;
          cursor: pointer; transition: border-color .2s; }
  #drop.drag { border-color: #6ea8fe; background: #1b2130; }
  #drop img { max-width: 240px; max-height: 240px; border-radius: 8px; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 16px; }
  .panel { flex: 1; min-width: 320px; background: #1b1e24; border-radius: 12px; padding: 16px; }
  .panel h3 { margin: 0 0 10px; font-size: 14px; color: #9aa3b2; text-transform: uppercase; letter-spacing: .5px; }
  .panel img { width: 100%; border-radius: 8px; background: #000; min-height: 200px; object-fit: contain; }
  button { background: #3b82f6; color: white; border: 0; border-radius: 8px; padding: 10px 18px;
           font-size: 14px; cursor: pointer; margin-top: 12px; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  #log { font-family: ui-monospace, monospace; font-size: 12px; color: #9aa3b2; white-space: pre-wrap;
         max-height: 260px; overflow-y: auto; }
  select, input[type=text] { background: #23262d; color: #e8e6e3; border: 1px solid #3a3f47;
           border-radius: 6px; padding: 7px 10px; margin: 4px 0; }
  label { font-size: 13px; color: #b8bfc9; display: block; margin-top: 8px; }
  #progressWrap { margin-top: 10px; display: flex; align-items: center; gap: 10px; }
  #progressTrack { flex: 1; height: 8px; background: #23262d; border-radius: 4px; overflow: hidden; }
  #progressBar { height: 100%; width: 0%; background: #3b82f6; transition: width .15s; }
  #progressText { font-size: 12px; color: #9aa3b2; white-space: nowrap; }
  .hint { font-size: 12px; color: #6b7280; margin-top: 6px; }
</style>
</head>
<body>
<header>
  <h1>MangaHue GPU Studio</h1>
  <span id="gpuBadge" class="badge no">checking WebGPU…</span>
</header>
<main>
  <div id="drop">
    <p><strong>Drop a manga page here</strong> (or click to browse)</p>
    <p id="fileInfo" style="font-size:13px; color:#9aa3b2;"></p>
  </div>

  <div class="row">
    <div class="panel">
      <h3>1 · Colorize on your GPU</h3>
      <label>Model (downloaded once, cached per tab)</label>
      <select id="modelSelect">
        <option value="full">DDColor-full fp16 · 436 MB · best quality</option>
        <option value="tiny">DDColor-tiny fp16 · 130 MB · faster load</option>
      </select>
      <div id="progressWrap" hidden>
        <div id="progressTrack"><div id="progressBar"></div></div>
        <span id="progressText"></span>
      </div>
      <label>Artist palette (per-series color vision)</label>
      <select id="palette">
        <option value="">auto (match the page fingerprint)</option>
        <option value="fantasy">fantasy</option>
        <option value="seinen">seinen</option>
        <option value="shojo">shojo</option>
        <option value="shonen">shonen</option>
        <option value="webtoon">webtoon</option>
      </select>
      <label>Style</label>
      <select id="style">
        <option value="configs/styles/target_style.yaml">Target muted warm</option>
        <option value="configs/styles/soft_cel_anime.yaml">Soft cel anime</option>
        <option value="configs/styles/studio_anime.yaml">Studio anime</option>
      </select>
      <label>Engine preset</label>
      <select id="preset">
        <option value="configs/engine.studio.yaml">Studio (full quality)</option>
        <option value="configs/engine.ensemble.yaml">Fast</option>
      </select>
      <button id="colorizeBtn" disabled>Colorize on my GPU</button>
      <p id="log"></p>
    </div>
    <div class="panel">
      <h3>2 · GPU draft (yours)</h3>
      <img id="draftImg" alt="draft">
    </div>
    <div class="panel">
      <h3>3 · Finished by the engine</h3>
      <img id="resultImg" alt="result">
      <p id="verdict" style="font-size:12px; color:#9aa3b2;"></p>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/ort.min.js"></script>
<script src="app.js"></script>
</body>
</html>
